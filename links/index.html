<meta name="description" content="AI engineer. What would you like to build?">

<style>
/* VOICE: warm, friendly, confident; a builder you'd want to message
   IDEA: a business card that opens into a short note to Sarah
   PICTURE: Sarah's photo with small dots orbiting it
   COLOUR and TYPE: chocolate brown ground, cream cards, caramel accent; Poppins
   LAYOUT: one centred phone-width column: identity, work-with-me form, links */
:root{color-scheme:light dark;
  --bg:light-dark(#f4ebe0,#1e130d);
  --card:light-dark(#fffaf3,#2b1a12);
  --ink:light-dark(#2b1a12,#f2e4d3);
  --soft:light-dark(#6b4a36,#c9b09a);
  --line:light-dark(#e6d6c3,#4a3022);
  --brown:#2b1a12;
  --caramel:#c07a43;
  --caramel-ink:light-dark(#9a5a2b,#e0a46f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Poppins,system-ui,sans-serif;overflow-x:clip}
.top{background:var(--brown);color:#f2e4d3;padding:40px 20px 84px;text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
.mark{position:relative;width:180px;height:180px;margin:0 auto 16px}.mark svg{position:absolute;inset:0;width:100%;height:100%}.mark img{position:absolute;inset:16px;width:148px;height:148px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.35)}
h1{font-size:34px;line-height:1.05;margin:0 0 8px;font-weight:700;text-wrap:balance}
.role{margin:0;color:#e0c3a6;font-size:17px}
.sub{margin:6px 0 0;color:#c9b09a;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-top:-56px;box-shadow:0 14px 40px rgba(43,26,18,.18)}
h2{font-size:22px;line-height:1.2;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--soft);font-size:15px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 6px}
input,textarea{width:100%;font:16px Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,a:focus-visible,button:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--caramel);color:#fff;font:600 16px Poppins,system-ui,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.mail{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;color:var(--soft);text-align:center}
.mail a{color:var(--caramel-ink);font-weight:600;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 12px;min-height:36px;font:500 13px Poppins,system-ui,sans-serif;cursor:pointer}
.note{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:light-dark(#f6e6d6,#3a2418);font-size:14px}
.note.show{display:block}
.links{display:grid;gap:12px;margin:22px 0 10px;padding:0;list-style:none}
.links a{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;transition:transform .15s ease}
.links a:hover{transform:translateY(-2px)}
.links svg{width:26px;height:26px;flex:none;color:var(--caramel-ink)}
.links span{flex:1}
.links small{color:var(--soft);font-weight:400;font-size:13px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:18px 0 36px}
@media(prefers-reduced-motion:reduce){.links a{transition:none}.orbit{animation:none!important}}
.orbit{transform-origin:75px 75px;transform-box:view-box;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
{
  const ADDR = 'elosarah85@gmail.com';
  const f = document.getElementById('f');
  const note = document.getElementById('note');
  f.addEventListener('submit', e => {
    e.preventDefault();
    const name = f.name.value.trim(), email = f.email.value.trim(), msg = f.msg.value.trim();
    if (!name || !email || !msg) {
      note.textContent = 'Please fill in your name, email and what you need.';
      note.classList.add('show');
      return;
    }
    const subject = encodeURIComponent('Project enquiry from ' + name);
    const body = encodeURIComponent(msg + '\n\n' + name + '\n' + email);
    note.textContent = 'Your email app should open with your message ready to send. If it doesn’t, copy the address below and email me directly.';
    note.classList.add('show');
    window.location.href = 'mailto:' + ADDR + '?subject=' + subject + '&body=' + body;
  });
  document.getElementById('copy').addEventListener('click', async e => {
    try { await navigator.clipboard.writeText(ADDR); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Select & copy'; }
    setTimeout(() => e.target.textContent = 'Copy', 2000);
  });
}
</script>
